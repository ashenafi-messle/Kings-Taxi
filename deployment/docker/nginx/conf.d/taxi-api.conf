# ==============================================================================
# Nginx Virtual Host Configuration: Kings Taxi Central API
# Domain: taxi-api.erkabskill.com / api.kingstaxi.com
# Upstream: kings-taxi-backend (127.0.0.1:3005)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name taxi-api.erkabskill.com api.kingstaxi.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taxi-api.erkabskill.com api.kingstaxi.com;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/taxi-api.erkabskill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxi-api.erkabskill.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client limits
    client_max_body_size 10M;

    # Reverse proxy to Kings Taxi backend container
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        # WebSocket & Connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts for real-time streams
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

